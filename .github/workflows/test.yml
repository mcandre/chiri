---
name: "Test"
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"
jobs:
  Test:
    runs-on: "ubuntu-24.04"
    steps:
    - uses: "actions/checkout@v7"
    - name: "provision buildx"
      uses: "docker/setup-buildx-action@v4"
    - uses: "dtolnay/rust-toolchain@stable"
      with:
        toolchain: "1.100.0"
    - run: |
        sudo apt-get update
        sudo apt-get install -y \
          libacl1-dev \
          libb2-dev \
          libbz2-dev
    - run: "make test"

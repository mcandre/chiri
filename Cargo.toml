[package]
name = "chiri"
description = "lightweight software package generator"
version = "0.0.1"
edition = "2024"
authors = ["Andrew Pennebaker <n4jm4@pm.me>"]
license = "0BSD"
repository = "https://github.com/mcandre/chiri"
exclude = [
    "*.mk",
    ".editorconfig",
    ".github",
    ".rubberstamp",
    ".tool-versions",
    "examples",
    "makefile",
    "vendor",
]

[dependencies]
ar = "0.9.0"
die = "0.2.0"
getopts = "0.2.24"
libarchive2 = "0.2.1"
rpm = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
toml = "0.9.8"

[lib]
name = "chiri"

[[bin]]
name = "chiri"
path = "src/chiri.rs"

[profile.release]
strip = "symbols"

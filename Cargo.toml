[package]
name = "chiri"
description = "crossplatform package generator"
version = "0.0.4"
edition = "2024"
authors = ["Andrew Pennebaker <n4jm4@pm.me>"]
license = "0BSD"
repository = "https://github.com/mcandre/chiri"
exclude = [
    "*.mk",
    ".editorconfig",
    ".github",
    ".rubberstamp",
    ".tool-versions",
    "examples",
    "makefile",
    "vendor",
]

[dependencies]
appimage-rs = "0.3.2"
die = "0.2.0"
getopts = "0.2.24"
hex = "0.4.3"
itertools = "0.15.0"
libarchive2 = "0.2.1"
rpm = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "0.9.8"
ureq = "3.5.2"
walkdir = "2.5.0"

[patch.crates-io]
libarchive2 = { git = "https://github.com/mcandre/libarchive-rs.git", branch = "issue-16" }

[lib]
name = "chiri"

[[bin]]
name = "chiri"
path = "src/chiri.rs"

[profile.release]
strip = "symbols"

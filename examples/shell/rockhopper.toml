# debug = true

[rocklet]
name = "raygun"
identifier = "test.mars.raygun"
version = "0.0.1"
rev = "1"
maintainer = "Marvin the Martian <marvin@mars.test>"
manufacturer = "Mars Corp"
summary = "Space modulator"
description = "Illudium Q-36 explosive space modulator"
copyright = "Copyright (C) 1948 Marvin the Martian"
license = "0BSD"
url = "https://mars.test/"

# [dest]
# "opt/raygun/bin" = "bin"

[[pkg]]
image = "n4jm4/rockhopper:appimage"
docker_args = [
    "--device", "/dev/fuse",
    "--cap-add", "SYS_ADMIN",
]
rocklet.oci_arch = "linux/amd64"
rocklet.chipset = "x86_64"
rocklet.appimage_executable = "raygun"
dest."usr/bin" = "bin"
dest."raygun.png" = "raygun.png"

[[pkg]]
image = "n4jm4/rockhopper:appimage"
docker_args = [
    "--device", "/dev/fuse",
    "--cap-add", "SYS_ADMIN",
]
rocklet.oci_arch = "linux/arm64"
rocklet.chipset = "aarch64"
rocklet.appimage_executable = "raygun"
dest."usr/bin" = "bin"
dest."raygun.png" = "raygun.png"

[[pkg]]
image = "n4jm4/rockhopper:fedora"
# rocklet.oci_arch = "linux/amd64"
# rocklet.chipset = "x86_64"
rocklet.chipset = "noarch"
# rocklet.dependencies = "bash"
# rocklet.pkg_licenselogic = "single"
dest."usr/bin" = "bin"

[[pkg]]
image = "n4jm4/rockhopper:freebsd"
rocklet.origin = "local/raygun"
# rocklet.oci_arch = "linux/amd64"
# rocklet.chipset = "freebsd:*:amd64"
rocklet.chipset = "freebsd:*"
# rocklet.dependencies = "bash: { origin: \"shells/bash\" }"
# rocklet.pkg_prefix = "/usr/local"
dest."usr/local/bin" = "bin"

[[pkg]]
image = "n4jm4/rockhopper:tarball"
rocklet.oci_arch = "linux/amd64"
rocklet.chipset = "all"
dest."opt/raygun/bin" = "bin"

[[pkg]]
image = "n4jm4/rockhopper:ubuntu"
# rocklet.oci_arch = "linux/amd64"
# rocklet.chipset = "amd64"
rocklet.chipset = "all"
# rocklet.dependencies = "bash"
# rocklet.apt_priority = "optional"
dest."usr/bin" = "bin"

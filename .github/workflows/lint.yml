---
name: "Lint"
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"
jobs:
  Lint:
    runs-on: "ubuntu-24.04"
    steps:
    - uses: "actions/checkout@v7"
    - uses: "dtolnay/rust-toolchain@stable"
      with:
        toolchain: "1.100.0"
    - run: |
        sudo apt-get update
        sudo apt-get install -y \
          libacl1-dev \
          libbz2-dev
    - name: "provision dev tools"
      run: "make -f install.mk"
    - run: "make lint"

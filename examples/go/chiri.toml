# petal.uname = "root"
# petal.gname = "wheel"
dest."usr/local/bin" = "bin/darwin/arm64"

[[pkg]]
kind = "rpm"
petal.chipset = "x86_64"
# petal.dependencies = "bash@5,curl@8"
dest."usr/bin" = "bin/linux/amd64"

[[pkg]]
kind = "rpm"
petal.chipset = "aarch64"
# petal.dependencies = "bash@5,curl@8"
dest."usr/bin" = "bin/linux/arm64"

[[pkg]]
kind = "tarball"
petal.chipset = "amd64"
dest."opt/raygun/bin" = "bin/linux/amd64"

[[pkg]]

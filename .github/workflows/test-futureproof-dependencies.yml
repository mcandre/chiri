---
name: "Test-Futureproof-Dependencies"
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  # POSIX cron format
  # https://pubs.opengroup.org/onlinepubs/9699919799/utilities/crontab.html
  schedule:
  # Once every 5 minutes
  # - cron: "*/5 * * * *"
  # Once a day
  - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"
jobs:
  Test-Futureproof-Dependencies:
    runs-on: "ubuntu-24.04"
    steps:
    - uses: "actions/checkout@v7"
    - name: "provision buildx"
      uses: "docker/setup-buildx-action@v4"
    - uses: "dtolnay/rust-toolchain@stable"
      with:
        toolchain: "1.100.0"
    - run: |
        sudo apt-get update
        sudo apt-get install -y \
            build-essential \
            clang \
            libacl1-dev \
            libb2-dev \
            libbz2-dev \
            liblz4-dev \
            libzstd-dev
    - name: "provision dev tools"
      run: "make -f install.mk"
    - run: |
        cargo upgrade --verbose --incompatible
        cargo update
        cargo vendor
    - run: "make test"

# debug = true

[petal]
name = "raygun"
identifier = "test.mars.raygun"
version = "0.0.1"
rev = "1"
pkg_version = "2" # Monotonically increasing version number for OpenBSD packages
# ebuild_category = "app-misc"
maintainer = "Marvin the Martian <marvin@mars.test>"
manufacturer = "Mars Corp"
summary = "Space modulator"
description = "Illudium Q-36 explosive space modulator"
copyright = "Copyright (C) 1948 Marvin the Martian"
license = "0BSD"
url = "https://mars.test/"

